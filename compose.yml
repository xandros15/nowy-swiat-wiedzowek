services:
  frontend:
    restart: always
    image: ${DOCKER_IMAGE_NAME}-frontend
  backend:
    restart: always
    image: ${DOCKER_IMAGE_NAME}-backend
    env_file:
      - .env
  proxy:
    restart: always
    image: ${DOCKER_IMAGE_NAME}-web
    ports:
      - "${PORT:-2137}:80"
    depends_on:
      - backend
      - frontend
